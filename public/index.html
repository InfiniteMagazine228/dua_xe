<!DOCTYPE html>
<html>
<head>
  <title>Game Đua Xe Vô Hạn</title>
  <style>
    body { margin:0; background:#222; text-align:center; }
    canvas { background:#333; display:block; margin:auto; }
    #menu, #gameOver {
      position:absolute; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.8); color:white; display:flex;
      justify-content:center; align-items:center; flex-direction:column;
    }
    button { padding:10px 20px; margin:10px; font-size:18px; }
    #mobileControls { position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-around; }
    #mobileControls button { width:80px; height:80px; border-radius:50%; font-size:24px; }
  </style>
</head>
<body>
<div id="menu">
  <h1>Game Đua Xe</h1>
  <button onclick="startGame('easy')">Easy</button>
  <button onclick="startGame('medium')">Medium</button>
  <button onclick="startGame('hard')">Hard</button>
</div>
<div id="gameOver" style="display:none;">
  <h1>Game Over</h1>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Chơi lại</button>
</div>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="mobileControls">
  <button onclick="moveLeft()">⬅️</button>
  <button onclick="moveRight()">➡️</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let car, obstacles, bonuses, score, roadY, gameRunning=false;
let obstacleSpeed, spawnRate, bonusRate;

// Sprite PNG
const carSprite = new Image();
carSprite.src = "car_red.png";
const obsSprite = new Image();
obsSprite.src = "car_blue.png";
const bonusSprite = new Image();
bonusSprite.src = "star.png";

let difficultySettings = {
  easy:   { speed:3, spawnRate:0.01, bonusRate:0.005 },
  medium: { speed:5, spawnRate:0.03, bonusRate:0.01 },
  hard:   { speed:7, spawnRate:0.05, bonusRate:0.02 }
};

function resetGame(){
  car = { x:180, y:500, width:40, height:80, speed:5 };
  obstacles = [];
  bonuses = [];
  score = 0;
  roadY = 0;
}

function startGame(level){
  let diff = difficultySettings[level];
  obstacleSpeed = diff.speed;
  spawnRate = diff.spawnRate;
  bonusRate = diff.bonusRate;
  document.getElementById("menu").style.display="none";
  document.getElementById("gameOver").style.display="none";
  resetGame();
  gameRunning=true;
  levelUp();
  requestAnimationFrame(gameLoop);
}

function restartGame(){ 
  document.getElementById("gameOver").style.display="none";
  document.getElementById("menu").style.display="flex";
}

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft") moveLeft();
  if(e.key==="ArrowRight") moveRight();
});

function moveLeft(){ if(car.x>100) car.x-=car.speed*2; }
function moveRight(){ if(car.x<300-car.width) car.x+=car.speed*2; }

function drawRoad(){
  ctx.fillStyle="#555"; ctx.fillRect(100,0,200,canvas.height);
  ctx.strokeStyle="white"; ctx.setLineDash([20,20]); ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(200,roadY); ctx.lineTo(200,canvas.height+roadY); ctx.stroke();
  roadY+=5; if(roadY>40) roadY=0;
}

function drawCar(){
  if (carSprite.complete) {
    ctx.drawImage(carSprite, car.x, car.y, car.width, car.height);
  }
}

function drawObstacles(){
  if(Math.random()<spawnRate){
    obstacles.push({x:100+Math.random()*160,y:-80,width:40,height:80});
  }
  obstacles.forEach(o=>{
    o.y+=obstacleSpeed;
    if (obsSprite.complete) {
      ctx.drawImage(obsSprite,o.x,o.y,o.width,o.height);
    }
  });
  obstacles=obstacles.filter(o=>o.y<canvas.height);
}

function drawBonuses(){
  if(Math.random()<bonusRate){
    bonuses.push({x:100+Math.random()*160,y:-40,width:30,height:30});
  }
  bonuses.forEach(b=>{
    b.y+=obstacleSpeed;
    if (bonusSprite.complete) {
      ctx.drawImage(bonusSprite, b.x, b.y, b.width, b.height);
    }
  });
  bonuses=bonuses.filter(b=>b.y<canvas.height);
}

function checkCollision(){
  for(let o of obstacles){
    if(car.x<o.x+o.width && car.x+car.width>o.x && car.y<o.y+o.height && car.y+car.height>o.y){
      gameRunning=false;
      document.getElementById("finalScore").innerText="Điểm số: "+score;
      document.getElementById("gameOver").style.display="flex";
    }
  }
  for(let b of bonuses){
    if(car.x<b.x+b.width && car.x+car.width>b.x && car.y<b.y+b.height && car.y+car.height>b.y){
      score+=50; // cộng điểm thưởng
      bonuses.splice(bonuses.indexOf(b),1);
    }
  }
}

function levelUp(){
  setInterval(()=>{ obstacleSpeed++; },30000); // tăng tốc mỗi 30 giây
}

function gameLoop(){
  if(!gameRunning) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawRoad();
  drawCar();
  drawObstacles();
  drawBonuses();
  checkCollision();
  score++;
  ctx.fillStyle="white";
  ctx.fillText("Score: "+score,10,20);
  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
